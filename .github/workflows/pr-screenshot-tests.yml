name: PR screenshot tests

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/*/shared/**'
      - 'core/**'
      - 'feature/**'
      - 'resources/**'
      - 'screenshot-tests/**'
      - '.github/workflows/pr-screenshot-tests.yml'
      - '.github/workflows/update-screenshot-goldens.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

concurrency:
  group: pr-screenshot-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  verify:
    name: Verify screenshot goldens
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify screenshot goldens
        run: xvfb-run -a ./gradlew :screenshot-tests:verifyRoborazziJvm --stacktrace

      - name: Upload screenshot test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshot-test-results
          path: |
            screenshot-tests/build/test-results/
            screenshot-tests/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload screenshot failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshot-failure-diagnostics
          path: |
            screenshot-tests/src/test/screenshots/
            screenshot-tests/build/outputs/roborazzi/
            screenshot-tests/build/reports/roborazzi/
            screenshot-tests/build/test-results/roborazzi/
          if-no-files-found: warn
          retention-days: 7
