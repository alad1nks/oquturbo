name: PR Android reminder runtime

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-reminder-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build the production debug application
        run: ./gradlew :app:oquturbo:androidApp:assembleDebug --max-workers=2
      - name: Install the official API33 image and require KVM
        run: |
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-33;default;x86_64'
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Four bounded real reminder episodes
        env:
          PYTHONUNBUFFERED: '1'
        run: >-
          python3 scripts/qa-android-reminders-runner.py
          --apk app/oquturbo/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          --output build/qa/reminders-android
      - name: Preserve complete or partial native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reminders-android-runtime
          path: |
            build/qa/reminders-android
            app/oquturbo/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
