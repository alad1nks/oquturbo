name: Diagnostic iOS collection capability (not acceptance)

on:
  push:
    branches: [ diagnostic/ios-collection-probe ]
    paths:
      - '.github/workflows/diagnostic-ios-collection-probe.yml'
      - 'scripts/qa-ios-diagnostic-capability.py'
      - 'scripts/test-ios-diagnostic-capability.py'
      - 'app/oquturbo/iosApp/OquTurboUITests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-ios-collection-probe
  cancel-in-progress: false

jobs:
  diagnostic-only:
    if: github.ref == 'refs/heads/diagnostic/ios-collection-probe'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate diagnostic harness
        run: python3 -B scripts/test-ios-diagnostic-capability.py
      - name: One disposable simulator collection probe (not acceptance)
        run: python3 -B scripts/qa-ios-diagnostic-capability.py --output build/qa/ios-diagnostic-capability
      - name: Preserve complete or incomplete investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnostic-capability-not-acceptance
          path: build/qa/ios-diagnostic-capability
          if-no-files-found: error
