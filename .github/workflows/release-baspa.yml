name: Release baspa

on:
  workflow_dispatch:
  push:
    branches: [ 'release/baspa/**' ]

permissions:
  contents: read

concurrency:
  group: release-baspa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: baspa
      android-secret-prefix: BASPA_
    secrets: inherit
