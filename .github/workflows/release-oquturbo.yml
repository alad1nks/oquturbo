name: Release oquturbo

on:
  workflow_dispatch:
  push:
    branches: [ 'release/oquturbo/**' ]

permissions:
  contents: read

concurrency:
  group: release-oquturbo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: oquturbo
      android-secret-prefix: OQUTURBO_
    secrets: inherit
