name: Release kenkoz

on:
  workflow_dispatch:
  push:
    branches: [ 'release/kenkoz/**' ]

permissions:
  contents: read

concurrency:
  group: release-kenkoz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: kenkoz
      android-secret-prefix: KENKOZ_
    secrets: inherit
