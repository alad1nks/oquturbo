name: Create release (shared)

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_APP: ${{ inputs.app }}
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo '::error::Run Create release with main selected.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Prepare version bump
        id: prepare
        run: python .github/scripts/prepare_release.py
      - name: Push new branch without overwriting existing refs
        if: steps.prepare.outputs.created == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: git push --force-with-lease="refs/heads/$RELEASE_BRANCH:" origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - name: Start release explicitly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: gh workflow run "release-$RELEASE_APP.yml" --ref "$RELEASE_BRANCH"
      - name: Summary
        env:
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          printf '\n[%s](%s/tree/%s) · [Release runs](%s/actions/workflows/release-%s.yml)\n' \
            "$RELEASE_BRANCH" "$REPOSITORY_URL" "$RELEASE_BRANCH" "$REPOSITORY_URL" "$RELEASE_APP" >> "$GITHUB_STEP_SUMMARY"
