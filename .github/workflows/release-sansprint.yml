name: Release sansprint

on:
  workflow_dispatch:
  push:
    branches: [ 'release/sansprint/**' ]

permissions:
  contents: read

concurrency:
  group: release-sansprint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: sansprint
      android-secret-prefix: ''
    secrets: inherit
