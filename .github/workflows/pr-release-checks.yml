name: PR release automation checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/scripts/*release*'
      - '.github/workflows/*release*'
      - 'app/**/build.gradle.kts'
      - 'app/**/Config.xcconfig'
      - 'app/**/project.pbxproj'
      - 'app/**/*.xcscheme'

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*release.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: bash -n .github/scripts/ios-release.sh
